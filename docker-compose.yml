version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: aegis-falkordb
    ports:
      - "6379:6379"   # FalkorDB Redis/Cypher protocol
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkor_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  falkor_data:
